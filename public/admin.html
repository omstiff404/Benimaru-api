<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Benimaru API</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a1a; --card: #12122a; --border: #2a2a4a;
      --cyan: #00e5ff; --pink: #ff2d95; --text: #f0f0ff; --muted: #8888aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 24px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
    .card {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 18px; max-width: 720px;
    }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input[type=text], input[type=password], input[type=url], input[type=file] {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #0d0d20; color: var(--text);
      font-family: inherit; margin-bottom: 12px;
    }
    button, .btn {
      background: var(--cyan); color: #000; border: none; font-weight: 700;
      padding: 10px 16px; border-radius: 8px; cursor: pointer; font-family: inherit;
    }
    button.danger { background: var(--pink); color: #fff; }
    button.ghost { background: transparent; color: var(--cyan); border: 1px solid var(--cyan); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .preview {
      width: 80px; height: 80px; object-fit: cover; border-radius: 8px;
      border: 2px solid var(--border); background: #000;
    }
    video.preview-v { width: 100%; max-height: 180px; border-radius: 8px; background: #000; }
    .track {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
    }
    .track small { color: var(--muted); }
    .msg { padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: .9rem; }
    .msg.ok { background: #0a3; color: #cfc; }
    .msg.err { background: #a03; color: #fcc; }
    #loginBox, #dash { max-width: 720px; margin: 0 auto; }
    #dash { display: none; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tabs button { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .tabs button.active { background: var(--cyan); color: #000; }
    .panel { display: none; }
    .panel.active { display: block; }
    code { font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--cyan); }
  </style>
</head>
<body>
  <div id="loginBox">
    <div class="card">
      <h1>Admin Login</h1>
      <p class="sub">Kelola avatar, video sampul, dan playlist musik</p>
      <div id="loginMsg"></div>
      <label>Password</label>
      <input type="password" id="password" placeholder="ADMIN_PASSWORD" />
      <button id="btnLogin">Masuk</button>
    </div>
  </div>

  <div id="dash">
    <h1>Dashboard Admin</h1>
    <p class="sub">Benimaru API · <a href="/" style="color:var(--cyan)">← Kembali ke site</a> · <button class="ghost" id="btnLogout" style="padding:4px 10px">Logout</button></p>
    <div id="dashMsg"></div>
    <div class="tabs">
      <button class="active" data-tab="avatar">Avatar & Video</button>
      <button data-tab="music">Musik</button>
      <button data-tab="brand">Brand</button>
    </div>

    <div class="panel active" id="panel-avatar">
      <div class="card">
        <h3 style="margin-bottom:12px">Avatar</h3>
        <img id="avPreview" class="preview" src="/avatar.jpg" alt="avatar" />
        <label style="margin-top:12px">Upload avatar (jpg/png, max 5MB)</label>
        <input type="file" id="avFile" accept="image/*" />
        <button id="btnAvUpload">Upload Avatar</button>
        <label style="margin-top:16px">Atau URL avatar</label>
        <input type="url" id="avUrl" placeholder="https://..." />
        <button id="btnAvUrl">Simpan URL</button>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px">Video sampul (di belakang avatar)</h3>
        <video id="vidPreview" class="preview-v" muted loop playsinline controls></video>
        <label style="margin-top:12px">Upload video (mp4/webm, max 50MB — disimpan di Aiven)</label>
        <input type="file" id="vidFile" accept="video/*" />
        <button id="btnVidUpload">Upload Video</button>
        <label style="margin-top:16px">Atau URL video</label>
        <input type="url" id="vidUrl" placeholder="https://.../video.mp4" />
        <button id="btnVidUrl">Simpan URL Video</button>
        <button class="danger" id="btnVidClear" style="margin-top:8px">Hapus video</button>
      </div>
    </div>

    <div class="panel" id="panel-music">
      <div class="card">
        <h3 style="margin-bottom:12px">Tambah musik (upload)</h3>
        <label>Judul</label>
        <input type="text" id="mTitle" placeholder="Judul lagu" />
        <label>Artis</label>
        <input type="text" id="mArtist" placeholder="Nama artis" />
        <label>File audio (mp3/ogg, max 15MB)</label>
        <input type="file" id="mFile" accept="audio/*" />
        <button id="btnMUpload">Upload & Tambah</button>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px">Atau lewat URL</h3>
        <label>Judul</label>
        <input type="text" id="mTitle2" placeholder="Judul" />
        <label>Artis</label>
        <input type="text" id="mArtist2" placeholder="Artis" />
        <label>URL audio</label>
        <input type="url" id="mUrl2" placeholder="https://.../lagu.mp3" />
        <button id="btnMUrl">Tambah dari URL</button>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px">Playlist</h3>
        <div id="trackList"></div>
      </div>
    </div>

    <div class="panel" id="panel-brand">
      <div class="card">
        <label>Nama brand</label>
        <input type="text" id="siteName" />
        <label>Sub title</label>
        <input type="text" id="siteSub" />
        <button id="btnBrand">Simpan Brand</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
